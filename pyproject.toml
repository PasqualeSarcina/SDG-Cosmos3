[project]
name = "sdg-cosmos3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema",
    "openai",
    "pillow",
    "pydantic",
    "requests",
    "tqdm",
    "tyro",
]

[project.optional-dependencies]
caption-audit = [
    "numpy",
    "qdrant-client",
    "pandas",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
llm-lora-cu130 = [
    "unsloth",
    "wandb",
    "vllm==0.32.0; sys_platform == 'linux'",
]
rfdetrn = [
    "rfdetr[train,augment]==1.11.2",
    "albumentations==2.0.8",
    "pytorch-lightning==2.6.5",
    "torchmetrics==1.8.2",
    "pycocotools==2.0.11",
    "wandb==0.25.0",
    "pyyaml",
]
sam = [
    "ijson",
    "numpy",
    "pycocotools",
    "torch",
    "torchvision",
    "transformers>=5.17,<6",
]

[tool.uv]
# Resolve only for the CUDA platforms used by this project. Other platforms can
# introduce unrelated conflicts while locking groups that are not being synced.
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
