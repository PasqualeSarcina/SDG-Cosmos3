[project]
name = "sdg-cosmos3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "pillow",
    "pydantic",
    "requests",
    "tqdm",
    "tyro",
]

[dependency-groups]
llm-lora-cu130 = [
    "unsloth",
    "wandb",
    "vllm"
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

