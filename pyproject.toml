[project]
name = "sdg-cosmos3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema",
    "openai",
    "pillow",
    "pydantic",
    "requests",
    "tqdm",
    "tyro",
]

[dependency-groups]
llm-lora-cu130 = [
    "unsloth",
    "wandb",
    "vllm",
]
rfdetrn = [
    "rfdetr[train,augment]==1.11.2",
    "albumentations==2.0.8",
    "pytorch-lightning==2.6.5",
    "torchmetrics==1.8.2",
    "pycocotools==2.0.11",
    "wandb==0.25.0",
    "tyro",
]
sam = [
    "numpy",
    "pycocotools",
    "torch",
    "torchvision",
    "transformers>=5,<6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
