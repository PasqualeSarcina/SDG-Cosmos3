[project]
name = "sdg-cosmos3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema",
    "openai",
    "pillow",
    "pydantic",
    "requests",
    "tqdm",
    "tyro",
]

[project.optional-dependencies]
caption-audit = [
    "numpy",
    "qdrant-client",
    "pandas",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
llm-lora-cu130 = [
    "unsloth",
    "wandb",
    "vllm==0.32.0; sys_platform == 'linux'",
    "torch",
    "torchvision",
]
rfdetrn-common = [
    "rfdetr[train,augment]==1.11.2",
    "albumentations==2.0.8",
    "pytorch-lightning==2.6.5",
    "torchmetrics==1.8.2",
    "pycocotools==2.0.11",
    "wandb==0.25.0",
    "pyyaml",
]
rfdetrn = [
    { include-group = "rfdetrn-common" },
    "torch",
    "torchvision",
]
rfdetrn-fp8 = [
    { include-group = "rfdetrn-common" },
    "rfdetr[cuda]==1.11.2",
    "torch==2.14.1+cu132",
    "torchvision==0.29.1+cu132",
    "transformer-engine[pytorch]==2.21.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The scheduled sync builds the extension in the project environment.
    "cuda-toolkit[crt,cccl]==13.2.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "ninja; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "packaging; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "setuptools; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wheel; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
sam = [
    "ijson",
    "numpy",
    "pycocotools",
    "torch",
    "torchvision",
    "transformers>=5.17,<6",
]

[tool.uv]
# Resolve only for the CUDA platforms used by this project. Other platforms can
# introduce unrelated conflicts while locking groups that are not being synced.
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
conflicts = [
    [{ group = "rfdetrn-fp8" }, { group = "llm-lora-cu130" }],
    [{ group = "rfdetrn-fp8" }, { group = "rfdetrn" }],
    [{ group = "rfdetrn-fp8" }, { group = "sam" }],
]

[tool.uv.extra-build-variables]
transformer-engine-torch = { NVTE_PYTORCH_FORCE_BUILD = "TRUE" }

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", group = "rfdetrn-fp8" },
    { index = "pytorch-cu130", group = "llm-lora-cu130" },
    { index = "pytorch-cu130", group = "rfdetrn" },
    { index = "pytorch-cu130", group = "sam" },
]
torchvision = [
    { index = "pytorch-cu132", group = "rfdetrn-fp8" },
    { index = "pytorch-cu130", group = "llm-lora-cu130" },
    { index = "pytorch-cu130", group = "rfdetrn" },
    { index = "pytorch-cu130", group = "sam" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
